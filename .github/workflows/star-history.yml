name: Update Star History

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours
  workflow_dispatch:

jobs:
  update-star-history:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README
        run: |
          # Update cache_bust timestamp
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H")
          sed -i "s/cache_bust=[^\"]*/cache_bust=$TIMESTAMP/g" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: refresh star history chart"
          git push
